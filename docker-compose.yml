# docker-compose.yml — miUrba API
#
# Uso:
#   1. Crear un config con tu API key (ej: copiar config.yaml y añadir tu endpoint+api_key)
#   2. docker compose up --build
#   3. http://localhost:8000/docs (Swagger UI)

services:
  miurba-api:
    build: .
    container_name: miurba-api
    ports:
      - "8000:8000"
    environment:
      - MIURBA_CONFIG=config.yaml
      - MIURBA_HOST=0.0.0.0
      - MIURBA_PORT=8000
    # Montar tu config con API keys (sobrescribe el config.yaml del image):
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3