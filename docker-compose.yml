# miUrba — generator + extractor containers.
#
# Build:  docker compose build
#
# Generate (test config, 3 complaints):
#   docker compose run --rm miurba-generator generate --config /config/config.test.yaml
# Extract:
#   docker compose run --rm miurba-extractor extract --config /config/config.test.yaml
#
# Run logs land in ./logs/ via the logging.file key (e.g. /logs/run.log).

services:
  miurba-generator:
    build: ./miurba-generator
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./config.test.yaml:/config/config.test.yaml:ro
      - ./data_test:/data
      - ./logs:/logs
    working_dir: /data

  miurba-extractor:
    build: ./miurba-extractor
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./config.test.yaml:/config/config.test.yaml:ro
      - ./schemas:/schemas:ro
      - ./data_test:/data
      - ./logs:/logs
    working_dir: /data
