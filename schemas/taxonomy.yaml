# taxonomy.yaml — vocabulario y distribución del dominio de quejas vecinales.
#
# Fuente de verdad única para las taxonomías (categories, affected_elements,
# zonas, riesgos, urgencias, expresiones, comunidades, personas, modificadores,
# pesos de muestreo y la tabla de coherencia element_subcategories).
# config.yaml solo contiene parámetros de ejecución y la referencia
# `taxonomy:` (p. ej. `taxonomy: ../../schemas/taxonomy.yaml` desde el
# config/ de un subproyecto).
# Este fichero alimenta los prompts, el muestreo, los validadores fail-fast y
# los enums de schemas/extraction_schema.json (sincronizados en runtime).
