# miUrba — 5K campaign runs (smoke and full).
#
# Standalone compose file for corpus campaigns: keeps the documented
# docker-compose.yml untouched while mounting the campaign configs and the
# results directory.
#
# Smoke:
#   docker compose -f docker-compose.5k.yml run --rm miurba-generator \
#     generate --config /configs/dataset5k_smoke.yaml
#
# Output: ./eval/results/dataset-5k-smoke/<model>/{raw,rejected.jsonl}
# Logs:   ./logs/generate-5k-smoke.log

services:
  miurba-generator:
    build: ./miurba-generator
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./element_subcategories.yaml:/element_subcategories.yaml:ro
      - ./miurba-generator/configs:/configs:ro
      - ./eval/results:/data
      - ./logs:/logs
