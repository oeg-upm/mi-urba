# Coherencia entre el problema y los elementos afectados que se le pueden asignar.
#
# Problema: `category_elements` mapea categoría → elementos, pero la subcategoría
# del elemento se sorteaba uniforme entre todas las del elemento, produciendo
# escenarios incoherentes (p.ej. fontanería/agua_caliente con tubería/saneamiento,
# o limpieza/barredura con suelo/solera_garaje). El generador no puede redactar
# eso de forma natural y el juez lo rechaza.
#
# Estructura:
#   element_subcategories:
#     <categoría>:
#       "*":            # base para cualquier subcategoría de problema de la categoría
#         <elemento>: [subcategorías válidas del elemento]
#       <subcategoría de problema>:   # excepción (opcional)
#         <elemento>: [...]
#
# Comodines:
#   <elemento>: "*"   → todas las subcategorías declaradas para ese elemento.
#   "*": "*"          → todos los elementos con todas sus subcategorías (solo varios).
#
# Reglas que verifica `validate_element_subcategories`:
#   - toda categoría de `categories` tiene entrada aquí;
#   - todo elemento citado existe en `affected_elements` y está en
#     `category_elements[<categoría>]`;
#   - toda subcategoría citada existe en `affected_elements[<elemento>]`;
#   - ninguna lista queda vacía.
version: 1
