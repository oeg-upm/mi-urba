# Demo config — thin config that inherits the shared taxonomy from the repo
# root config.yaml (via `inherits:`), so only the demo-specific bits live here:
# endpoints, models, generation plan and extraction dirs.
#
# Requires NEURALWATT_API_KEY in .env or the environment.
inherits: ../config.yaml

endpoints:
  neuralwatt:
    base_url: https://api.neuralwatt.com/v1
    description: NeuralWatt API (OpenAI-compatible)
    api_key: ${NEURALWATT_API_KEY}
  llama_swap:
    base_url: http://llama-swap.local:9292
    description: Local GPU cluster via llama-swap

models:
  kimi-k2.6:
    endpoint: neuralwatt
    model: kimi-k2.6
    temperature: 0.85
  kimi-k2.5:
    endpoint: neuralwatt
    model: moonshotai/Kimi-K2.5
    temperature: 0.85
  qwen3.5-397b:
    endpoint: neuralwatt
    model: qwen3.5-397b
    temperature: 0.85
  glm-5.1:
    endpoint: neuralwatt
    model: glm-5.1
    temperature: 0.85
  glm-5.2:
    endpoint: neuralwatt
    model: glm-5.2
    temperature: 0.85
  qwen3_local:
    endpoint: llama_swap
    model: qwen3.6-27b-q6-k-xl-mtp-2
    temperature: 0.85

generation:
  # Demo output (relative to miurba-generator/, where the CLI runs)
  default_output_dir: ../demo/output
  batches:
  - model: kimi-k2.6
    count: 3
  - model: qwen3_local
    count: 3

extraction:
  model: kimi-k2.6
  temperature: 0.2
  raw_dir: ../demo/output/raw
  annotated_dir: ../demo/output/annotated
  images_dir: ../demo/output/images
  resume: false
