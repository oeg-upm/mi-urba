# Sample — variante paramétrica de smoke: 5 generadores × 100 registros con
# temperatura 0.50 y salida 4K, resume: false.
#
#   docker compose -f docker-compose-example.yaml run --rm miurba-generator \
#     generate --config /configs/dataset_smoke_5x100_t050.yaml
taxonomy: taxonomy.yaml

logging:
  level: INFO
  file: /logs/smoke-5x100-t050.log

endpoints:
  generadores:
    base_url: http://192.168.10.11:9292
  juez:
    base_url: http://192.168.10.100:9292

models:
  gemma-3-12b-awq:
    endpoint: generadores
    model: gemma-3-12b-it-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  olmo-3.1-32b-awq:
    endpoint: generadores
    model: olmo-3.1-32b-instruct-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  qwen3.6-27b-awq:
    endpoint: generadores
    model: qwen3.6-27b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
  muse-glimmer-30b-awq:
    endpoint: generadores
    model: muse-glimmer-30b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  gpt-oss-20b:
    endpoint: generadores
    model: gpt-oss-20b-vllm
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  juez-qwen35-9b:
    endpoint: juez
    model: qwen3.5-9b-awq
    temperature: 0.5
    extra_params:
      max_tokens: 2500
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false

generation:
  default_output_dir: /data/smoke-5x100-t050
  models:
  - gemma-3-12b-awq
  - olmo-3.1-32b-awq
  - qwen3.6-27b-awq
  - muse-glimmer-30b-awq
  - gpt-oss-20b
  num_records: 100
  start_id: 1
  seed: 42
  resume: false
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  model_load_wait: 600
  validate: true
  validator: juez-qwen35-9b
  max_validation_retries: 3
  workers: 8
