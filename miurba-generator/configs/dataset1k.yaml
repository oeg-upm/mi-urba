# Sample — campaña de corpus: 4 generadores × 300 intentos, juez distinto, resume.
#
#   docker compose -f docker-compose-example.yaml run --rm miurba-generator \
#     generate --config /configs/dataset1k.yaml
#
# Requiere los endpoints LAN de llama-swap (192.168.10.11/.100:9292).
# Salida: /data/dataset-1k/<modelo>/raw/ + rejected.jsonl + conversations.jsonl
taxonomy: taxonomy.yaml

logging:
  level: INFO
  file: /logs/generate-1k.log

endpoints:
  generadores:
    base_url: http://192.168.10.11:9292
  juez:
    base_url: http://192.168.10.100:9292

models:
  gemma-3-12b-awq:
    endpoint: generadores
    model: gemma-3-12b-it-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  qwen3.6-27b-awq:
    endpoint: generadores
    model: qwen3.6-27b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
  muse-glimmer-30b-awq:
    endpoint: generadores
    model: muse-glimmer-30b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  gpt-oss-20b:
    endpoint: generadores
    model: gpt-oss-20b-vllm
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  juez-qwen38-27b:
    endpoint: juez
    model: qwen3.8-27b-ud-q4-dflash2
    temperature: 0.0
    extra_params:
      max_tokens: 6000

generation:
  default_output_dir: /data/dataset-1k
  models:
  - gemma-3-12b-awq
  - qwen3.6-27b-awq
  - muse-glimmer-30b-awq
  - gpt-oss-20b
  num_records: 300
  start_id: 1
  seed: 42
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  model_load_wait: 600
  validate: true
  validator: juez-qwen38-27b
  max_validation_retries: 3
  workers: 8
