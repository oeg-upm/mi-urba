# Sample — smoke multi-modelo delgado: 5 generadores × 20 registros, resume.
#
#   docker compose -f docker-compose-example.yaml run --rm miurba-generator \
#     generate --config /configs/dataset5k_smoke_coherent.yaml
taxonomy: taxonomy.yaml

logging:
  level: INFO
  file: /logs/generate-5k-smoke-coherent.log

endpoints:
  generadores:
    base_url: http://192.168.10.11:9292
    description: llama-swap en .11 — los cinco generadores del corpus de 50k
  juez:
    base_url: http://192.168.10.100:9292
    description: llama-swap en .100 — juez de validación

models:
  gemma-3-12b-awq:
    endpoint: generadores
    model: gemma-3-12b-it-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
  olmo-3.1-32b-awq:
    endpoint: generadores
    model: olmo-3.1-32b-instruct-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
  qwen3.6-27b-awq:
    endpoint: generadores
    model: qwen3.6-27b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
  muse-glimmer-30b-awq:
    endpoint: generadores
    model: muse-glimmer-30b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
  gpt-oss-20b:
    endpoint: generadores
    model: gpt-oss-20b-vllm
    temperature: 0.85
    extra_params:
      max_tokens: 2048
  juez-qwen35-9b:
    endpoint: juez
    model: qwen3.5-9b-awq
    temperature: 0.0
    extra_params:
      max_tokens: 1200
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false

generation:
  default_output_dir: /data/dataset-5k-smoke-coherent
  models:
  - gemma-3-12b-awq
  - olmo-3.1-32b-awq
  - qwen3.6-27b-awq
  - muse-glimmer-30b-awq
  - gpt-oss-20b
  num_records: 20
  start_id: 1
  seed: 42
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  model_load_wait: 600
  validate: true
  validator: juez-qwen35-9b
  max_validation_retries: 3
  photos: false
  workers: 8
