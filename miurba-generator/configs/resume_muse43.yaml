inherits: config.yaml   # thin config: taxonomy comes from taxonomy.yaml
logging:
  level: INFO
  file: /logs/generate-50k-rest.log
endpoints:
  llama_swap:
    base_url: http://192.168.10.11:9292
    description: llama-swap en .11 (vLLM, quants AWQ/MXFP4)
models:
  olmo-3.1-32b-awq:
    endpoint: llama_swap
    model: olmo-3.1-32b-instruct-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
  qwen3.6-27b-awq:
    endpoint: llama_swap
    model: qwen3.6-27b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 2048
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
  muse-glimmer-30b-awq:
    endpoint: llama_swap
    model: muse-glimmer-30b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
generation:
  default_output_dir: /data
  models:
  - muse-glimmer-30b-awq
  num_records: 10000
  start_id: 1
  seed: 4242
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  model_load_wait: 1200
  validate: false
  workers: 10
extraction:
  model: kimi-k2.6
  temperature: 0.2
  default_output_dir: null
  raw_dir: null
  annotated_dir: null
  images_dir: null
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  stage_split: false
  vision_model: null
  model_load_wait: null
  workers: 1
paths:
  raw_subdir: raw
  annotated_subdir: annotated
  images_subdir: images
  complaints_file: complaints.jsonl
  extractions_file: extractions.jsonl
  ground_truth_file: ground_truth.jsonl
  metadata_file: metadata.jsonl
image_generation:
  enabled: false
  backend: flux2
  cache: diffusers/FLUX.2-dev-bnb-4bit
  output_subdir: images
  size: 1024
  steps: 28
  guidance: 4.0
  device0: cuda:0
  device1: cuda:1
  seed_base: 42
















