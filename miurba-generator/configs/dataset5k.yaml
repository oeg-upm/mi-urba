# Corpus 5K — cinco generadores × 1.000 registros, juez gemma4-12b con prompt v11.
#
#   docker compose -f docker-compose.5k.yml run --rm miurba-generator \
#     generate --config /configs/dataset5k.yaml
#
# Salida: /data/dataset-5k/<modelo>/{raw/,rejected.jsonl,conversations.jsonl}
# resume: true → relanzable sin rehacer lo ya generado.
inherits: config.yaml

logging:
  level: INFO
  file: /logs/generate-5k.log

endpoints:
  generadores:
    base_url: http://192.168.10.11:9292
    description: llama-swap .11 — los cinco generadores del corpus
  juez:
    base_url: http://192.168.10.100:9292
    description: llama-swap .100 — juez de validación

models:
  gemma-3-12b-awq:
    endpoint: generadores
    model: gemma-3-12b-it-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  olmo-3.1-32b-awq:
    endpoint: generadores
    model: olmo-3.1-32b-instruct-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  qwen3.6-27b-awq:
    endpoint: generadores
    model: qwen3.6-27b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false
  muse-glimmer-30b-awq:
    endpoint: generadores
    model: muse-glimmer-30b-awq
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  gpt-oss-20b:
    endpoint: generadores
    model: gpt-oss-20b-vllm
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  juez-gemma4-12b:
    endpoint: juez
    model: gemma4-12b-awq
    temperature: 0.0
    extra_params:
      max_tokens: 3500
      enable_thinking: false
      chat_template_kwargs:
        enable_thinking: false

generation:
  default_output_dir: /data/dataset-5k
  models:
  - gemma-3-12b-awq
  - olmo-3.1-32b-awq
  - qwen3.6-27b-awq
  - muse-glimmer-30b-awq
  - gpt-oss-20b
  num_records: 1000
  start_id: 1
  seed: 42
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  model_load_wait: 600
  validate: true
  validator: juez-gemma4-12b
  max_validation_retries: 3
  photos: false
  workers: 8
