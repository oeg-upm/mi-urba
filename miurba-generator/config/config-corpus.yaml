# Example — corpus campaign: N generators × M attempts, judge, resume: true.
# Replace the your-*-model placeholders with real model ids of your endpoint.
#
#   python cli.py generate --config config/config-corpus.yaml
taxonomy: ../../schemas/taxonomy.yaml

logging:
  level: INFO
  file: null

endpoints:
  openai:
    base_url: ${OPENAI_API_ENDPOINT}
    description: OpenAI-compatible endpoint
    api_key: ${OPENAI_API_KEY}

models:
  generator-a:
    endpoint: openai
    model: your-generator-model-a
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  generator-b:
    endpoint: openai
    model: your-generator-model-b
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  generator-c:
    endpoint: openai
    model: your-generator-model-c
    temperature: 0.85
    extra_params:
      max_tokens: 4096
  judge:
    endpoint: openai
    model: your-judge-model
    temperature: 0.1
    extra_params:
      max_tokens: 6000

generation:
  default_output_dir: data/corpus
  models:
  - generator-a
  - generator-b
  - generator-c
  num_records: 300
  start_id: 1
  seed: null
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  validate: true
  max_validation_retries: 3
  validator: judge
  model_load_wait: null
  workers: 8
