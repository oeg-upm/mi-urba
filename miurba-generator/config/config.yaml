# miurba-generator — default config (example).
# Secrets go in miurba-generator/.env (gitignored), referenced as ${VAR}.
taxonomy: ../../schemas/taxonomy.yaml

logging:
  level: INFO
  file: null

endpoints:
  ollama:
    base_url: http://localhost:11434
    description: Local Ollama (OpenAI-compatible)

models:
  llama:
    endpoint: ollama
    model: llama3.1
    temperature: 0.85

generation:
  default_output_dir: data
  batches:
  - model: llama
    count: 10
  start_id: 1
  seed: null
  resume: true
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  validate: false
  max_validation_retries: 3
  validator: null
  model_load_wait: null
  workers: 1

paths:
  raw_subdir: raw
  annotated_subdir: annotated
  complaints_file: complaints.jsonl
  extractions_file: extractions.jsonl
  ground_truth_file: ground_truth.jsonl
  metadata_file: metadata.jsonl
