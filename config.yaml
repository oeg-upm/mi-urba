personas:
  abuela_veterana:
    profile: Mujer mayor de 75, viuda, más de 30 años en la comunidad. Conoce a todos
      los vecinos. Autoridad moral.
    style: Formal pero cercano. "Mire usted, señor administrador", "llevo toda la
      vida aquí". Detalla todo con referencias al pasado. Mensajes largos y pausados.
    weight: 8
  abuelo_ajetreado:
    profile: Hombre mayor de 70, con movilidad reducida. Vive solo. Depende del ascensor
      y las zonas accesibles.
    style: Tono quejumbroso pero resignado. "Ya estoy mayor para estas cosas", "no
      puedo subir las escaleras". Enfatiza cómo le afecta personalmente. Pide que
      lo tengan en cuenta.
    weight: 5
  joven_profesional:
    profile: Hombre de 28-35, profesional urbano, vive solo. Poco tiempo, mucha tecnología.
      Primera vez que contacta.
    style: Directo, conciso, coloquial joven. "tío", "va mal", "da la sensación".
      Mensajes cortos. Emojis en WhatsApp. No conoce procedimientos.
    weight: 6
  chica_millennial:
    profile: Mujer de 30-38, trabaja desde casa. Observa todo porque está mucho en
      el edificio. Algo ansiosa.
    style: Escribe rápido, muchos detalles. "Oye que he visto...", "es que me pasa
      justo debajo". Algo dramática pero amable. Emojis moderados.
    weight: 5
  madre_preocupada:
    profile: Mujer de 35-45, madre de niños pequeños. Hipervigilante con la seguridad.
      3-5 años en la comunidad.
    style: Tono preocupado, enfatiza riesgos infantiles. "Mi hijo podría caer", "los
      niños juegan ahí". Exclamaciones. Pide urgencia a veces desproporcionada.
    weight: 7
  padre_activo:
    profile: Padre de 40-50, implicación media-alta. Lleva a los niños al parque de
      la comunidad. Práctico y resolutivo.
    style: Tono práctico y directo. "Mira, el tema es este", "lo que hay que hacer
      es...". Sugiere soluciones más que quejarse. Mensajes estructurados.
    weight: 5
  estudiante_universitario:
    profile: Chico de 20-25, estudiante, comparte piso. Poca idea de cómo funciona
      la comunidad. Solo quiere que funcionen las cosas básicas.
    style: Muy informal, casi desinterés. "oe se ha roto la ducha esa", "el ascensor
      no va". Minimalista. Faltas de ortografía. Mensajes muy cortos.
    weight: 4
  pareja_mayor:
    profile: Matrimonio jubilado de 65-75. Ella escribe, pero cuenta lo que dice su
      marido. Muy implicados.
    style: Tono formal conyugal. "Mi marido dice que...", "nosotros creemos que...".
      Corregible y cortés. Mensajes largos y detallistas.
    weight: 4
  vecino_conflictivo:
    profile: Quejica reincidente. Ya ha llamado varias veces. Se frustra porque siente
      que no le hacen caso.
    style: Agresivo y exigente. "Otra vez", "es una vergüenza", "si no lo arreglan
      me planto". MAYÚSCULAS. Amenazas legales. Reacción desproporcionada al problema.
    weight: 4
  vecina_pasivo_agresiva:
    profile: No quiere parecer conflictiva pero está molesta. Indirectas, tercera
      persona. "No es por mí, pero...".
    style: Aparentemente amable, cargada de indirectas. "No sé si alguien más lo habrá
      notado...", "supongo que no es para tanto". "Por si acaso". Va subiendo de tono.
    weight: 5
  vecino_ansioso:
    profile: Preocupada por todo. Exagera la gravedad. Necesita respuesta inmediata.
      Poco tiempo en la comunidad.
    style: 'Muchos !! y ??. Exagera: "esto es peligrosísimo", "no se puede vivir así".
      Pide que vengan "ya". Repite el mismo problema varias veces.'
    weight: 5
  vecino_formal:
    profile: Mediana edad, profesional liberal o funcionario. Educado, correcto, puntuoso.
      Valora las formas.
    style: Cortés y comedido. "Estimado señor administrador", "Sin otro particular,
      cordial saludo". Párrafos. Sin abreviaturas. Cita fechas y referencias concretas.
    weight: 6
  vecino_informal_amable:
    profile: Simpático y colaborativo. Buena relación con el administrador. Aporta
      soluciones. Lleva tiempo.
    style: Cercano y positivo. "Hola, ¿qué tal?", "Muchas gracias como siempre". Sin
      dramatismo. Sugiere soluciones. Coloquial amable.
    weight: 6
  vecino_primerizo:
    profile: Primera vez que contacta al administrador. Tiene vergüenza. No sabe si
      merece la pena.
    style: Dubitativo y disculpador. "No sé si esto te toca", "perdona si no es el
      sitio", "quizás no sea gran cosa". Con reparos. Pregunta si es el canal correcto.
    weight: 4
  vecino_tecnico:
    profile: Ingeniero o profesional técnico. Preciso, terminología específica. No
      especula.
    style: Preciso y técnico. "Fisura de retracción de 2mm", "PVC Ø110 con pérdida".
      Estructurado. No emocional. Sugiere soluciones técnicas.
    weight: 3
  vecino_conspiranoico:
    profile: Desconfía de todo. Cree que la comunidad le oculta cosas, que las obras
      son innecesarias, que hay enchufismo.
    style: Sospecha en todo. "Seguro que ya lo sabíais", "no me extraña que no se
      haya hecho nada". Teorías sobre por qué no arreglan. Cita "otras veces que".
      Desconfianza.
    weight: 3
  vecino_egoista:
    profile: Solo se preocupa si le afecta directamente. Si es en otra zona, ni caso.
      Exige que lo suyo sea prioritario.
    style: Directo y egocéntrico. "A MÍ me afecta", "quiero que me lo arreglen a mí
      primero". Minimiza problemas ajenos. "Lo del tercero no es tan urgente".
    weight: 4
  vecino_cotilla:
    profile: Sabe todo lo que pasa. Reporta problemas de otros vecinos. "Me ha dicho
      la del 3ºB que...". Se implica en todo.
    style: Informativo pero entrometido. "Oye, que la señora Carmen me ha dicho que...",
      "he visto que en el portal del 2 hay...". Cuenta lo de otros como propio. Chismorreo.
    weight: 4
  vecino_voluntarioso:
    profile: Siempre se ofrece para todo. Pertenece a la comisión de fiestas, de jardines,
      de lo que haga falta. A veces se mete donde no le llaman.
    style: 'Entusiasta y colaborativo. "Yo puedo echar una mano", "si necesitáis algo
      avisadme". A veces impositivo: "yo ya le he dicho al fontanero que...". Mensajes
      largos con propuestas.'
    weight: 3
  vecino_racional:
    profile: Analítico y frío. No se emociona. Causa-efecto. Prioriza por coste-beneficio.
      Piensa en el presupuesto de la comunidad.
    style: Objetivo y económico. "Si lo arreglamos ahora sale más barato", "es mejor
      invertir en prevención". Sin emociones. Referencias al dinero. Propone priorizar.
    weight: 3
  vecino_hipocondriaco:
    profile: Cualquier problema físico le parece un riesgo sanitario grave. Humedad
      = asma, insectos = enfermedad, ruido = estrés.
    style: Alarma sanitaria. "Esta humedad nos va a provocar asma", "las cucarachas
      transmiten enfermedades". Exagera riesgos para la salud. Pide desinfección inmediata.
    weight: 3
  vecino_sumiso:
    profile: Se queja lo mínimo. Se disculpa por molestar. Acepta cualquier respuesta.
      Tarda en reportar porque "no quiere dar la lata".
    style: Excesivamente comedido. "Perdona, no quería molestar", "si no es mucha
      molestia...", "solo era por si acaso". Minimiza su propio problema. Se disculpa
      al final.
    weight: 4
  presidente_comunidad:
    profile: Presidente de la comunidad de propietarios. Conoce estatutos, presupuestos,
      historial. Habla en nombre de otros.
    style: 'Institucional. "Como presidente", "en la última junta se acordó". Cita
      normativas. Estructura: problema, urgencia, propuesta. Adjunta fotos de otros
      vecinos.'
    weight: 4
  portero_encargado:
    profile: Conserje o portero del edificio. Conoce mejor que nadie el estado de
      las zonas comunes. Reporta lo que ve en su ronda.
    style: Tono práctico y coloquial de trabajador. "Don Pepe, que me he dao cuenta
      que...", "esta mañana al hacer la ronda he visto que...". Conoce nombres de
      vecinos y zonas. Usa términos de mantenimiento.
    weight: 3
  propietario_ausente:
    profile: Propietario que no reside, alquila el piso. Conoce la comunidad por lo
      que le dice el inquilino.
    style: Informa de segunda mano. "Me comenta mi inquilino que...". Formal. Pide
      información adicional. Referencia responsabilidades de la comunidad.
    weight: 4
  propietario_tacaño:
    profile: Propietario que vive ahí pero se opone a cualquier gasto. Cuestiona todas
      las derramas. Cree que todo es un timo.
    style: Económico y receloso. "¿Cuánto va a costar esto?", "otra derrama más",
      "seguro que se puede arreglar más barato". Cuestiona la necesidad. Compara precios.
    weight: 3
  inquilino_reciente:
    profile: Se acaba de mudar (2-6 meses). No conoce zonas comunes ni procedimientos.
    style: Inseguro, pregunta más que afirma. "¿A quién le doy parte?", "no sé si
      esto es competencia de la comunidad". Nombres vagos de zonas. Mensajes breves.
    weight: 5
  inquilino_transeunte:
    profile: Estudiante o joven temporal. No se implica. Reporta lo mínimo. Se muda
      en meses.
    style: Despreocupado. "Se ha roto X", sin más contexto. No pide seguimiento. "Si
      pueden mirarlo". Tono de quien no se siente parte de la comunidad.
    weight: 3
  vecino_nocturno:
    profile: Trabaja de noche o tiene insomnio. Reporta problemas que ve a las 3am.
      Ruidos, luces, cosas que los demás no notan.
    style: 'Menciona la hora: "a las 3 de la mañana", "anoche a las 4". Observaciones
      que otros no hacen. "He visto que la luz del garaje parpadea de noche". Tono
      de quien vigila.'
    weight: 2
  vecino_nuevo_dinero:
    profile: Acaba de comprar un piso caro. Expectativas altísimas. No tolera imperfecciones.
      Recién llegada de chalet.
    style: Exigente y con expectativas de servicio premium. "Acabo de comprar y ya
      tengo problemas", "en mi anterior comunidad esto no pasaba". Comparaciones con
      estándares altos. Tono indignado.
    weight: 2
  vecino_ecologista:
    profile: Muy consciente del medio ambiente. Se preocupa por productos químicos,
      consumos, residuos, eficiencia energética.
    style: Preocupación verde. "¿Qué productos usan para desinfectar?", "esos LEDs
      consumen mucho", "el riego debería ser por goteo". Cuestiona métodos. Propone
      alternativas ecológicas.
    weight: 2
  vecino_inmobiliaria:
    profile: Agente inmobiliario que gestiona varios pisos en la comunidad. Reporta
      por encargo de propietarios. Profesional pero con prisa.
    style: Profesional y expeditivo. "Le escribo en representación del propietario
      del 3ºB", "necesito que se regularice cuanto antes para la visita de esta semana".
      Cita pisos con puerta. Pide plazos concretos.
    weight: 2
  vecino_retirado_vocacional:
    profile: Jubilado que se ha metido a hobbies. Jardinería, bricolaje... Arregla
      cosas él mismo, a veces mal.
    style: Práctico y auto-suficiente. "Yo ya le he echado un ojo, creo que es la
      junta de dilatación", "le he puesto cinta aislante de momento". Confía en su
      criterio. A veces informa de arreglos "provisionales" que hizo él.
    weight: 2
