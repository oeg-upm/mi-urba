modifiers:
  semianalfabeto:
    description: Escribe como habla, sin ortografía ni puntuación. faltas constantes.
    style_override: 'Escribe con faltas de ortografía graves: hache mudas (ojo por
      hojo), b/v mezcladas, g/j, s/c/z, sin puntuación o puntuación aleatoria. Frases
      larguísimas sin punto. Todo seguido o todo en minúscula. "k" por "qu", abreviaciones
      SMS. Ejemplo: "k se a roto la tuberia y ai agua x todos ldao".'
    prob: 0.08
  dictado_voz:
    description: Usa dictado por voz del móvil. Errores de transcripción.
    style_override: 'Incluye errores típicos de transcripción voz a texto: palabras
      mal reconocidas ("gabete" por "gaveta"), puntuación ausente o aleatoria, frases
      que se cortan y recomienzan, repeticiones por fallo del dictado. Ejemplo: "Hola
      oye que el ascensor no funciona bueno sí funciona pero se queda parado en el
      segundo piso no sé si me explico".'
    prob: 0.06
  solo_mayusculas:
    description: Escribe todo en mayúsculas porque le cuesta leer la pantalla.
    style_override: 'TODO EN MAYÚSCULAS. No es agresión, es su forma de escribir.
      Puntuación básica. Frases cortas y directas. Ejemplo: "SE HA ROTO EL ASCENSOR
      OTRA VEZ POR FAVOR ARREGLADLO".'
    prob: 0.04
  exceso_emojis:
    description: Acompaña cada frase con emojis excesivos.
    style_override: 'Emojis por todas partes. Cada frase va acompañada de 2-4 emojis.
      Emojis que refuerzan la emoción. Ejemplo: "el ascensor está roto otra vez 😡🤦‍♀️
      es que ya no puedo más 😫😫 subir 4 pisos 🧗‍♀️🔥 por favor arregladlo ya 🙏🙏🆘".'
    prob: 0.05
  ultra_conciso:
    description: Escribe lo mínimo imprescindible. Telegráfico.
    style_override: Extremadamente breve. 2-5 palabras. Sin saludo, sin despedida,
      sin contexto. "Ascensor roto", "fuga garaje", "persiana portal 2 caída". A veces
      solo un sustantivo y un adjetivo.
    prob: 0.04
  redundante:
    description: No sabe resumir. Dice lo mismo tres veces con palabras distintas.
    style_override: Repetitivo y prolijo. Dice lo mismo de tres formas distintas.
      "Es que hay una fuga, o sea que sale agua, o sea que pierde agua la tubería".
      Mensajes muy largos. Rodea antes de llegar al punto. Añade detalles innecesarios.
    prob: 0.04
  habla_andaluza:
    description: 'Andaluz: ceceo/seseo, aspiración, contracciones.'
    style_override: 'Andaluz escrito: "na má" por "nada más", "usté" por "usted",
      "pohía" por "podía", "to esto" por "todo esto". Ceceo: "grasia" por "gracia".
      Contracciones: "pa''l", "na de na". Tono cálido. "Mire usté, que se ha desprendío
      too el revoco de la fachá y náide dice ná".'
    prob: 0.06
  habla_catalana:
    description: Bilingüe catalán/castellano con interferencias.
    style_override: 'Castellano con interferencias catalanas: calcos sintácticos ("a
      la hora de hacer" por "al hacer"), "home" como muletilla, "adéu" de cierre,
      posesivos "mi llave" por "la llave". Correcto pero con giros propios.'
    prob: 0.04
  habla_gallega:
    description: Gallego con giros y estructuras propias.
    style_override: 'Castellano con gallegadas: "¿qué se le ofrece?", uso del condicional
      por subjuntivo, "cando" por "cuando", "véña" por "venga". Tono amable y algo
      arcaizante. "Pois mire, que cho digo que a tubería está rota desde faismos tempo".'
    prob: 0.03
  habla_canaria:
    description: Canario con suavidad y modismos propios.
    style_override: 'Canario: "mire usted mi llave" (posesivo), "hay mucho agua pa''l
      piso", "¿qué es lo que hay?". Seseo. Tono tranquilo y pausado. "Mire, mi llave,
      que el agua viene pa''bajo y no para".'
    prob: 0.03
  origen_latinoamericano:
    description: Latinoamericano con vocabulario y expresiones propias.
    style_override: 'Español con expresiones latinoamericanas: "che", "óyeme", "parcero".
      Vocabulario diferente: "apartamento" no "piso", "edificio" no "bloque", "carro"
      no "coche". Tono amable. "Óyeme, el ascensor está dañado, hay que arreglarlo
      ya mismo".'
    prob: 0.05
  origen_arabe:
    description: Árabe-hablante con español funcional y errores típicos.
    style_override: 'Español con errores de hablante de árabe: artículos ("el agua
      está roto"), orden calco del árabe, omisiones de pronombres. "Yo quiere hablar
      con administrador". Tono respetuoso. Puede cerrar con "inshallah" o "gracias
      por todo".'
    prob: 0.04
  origen_chino:
    description: Hablante de chino con español funcional, errores sistemáticos.
    style_override: 'Español con errores sistemáticos: confusión r/l ("lobo" por "robo"),
      omisión de artículos, orden SVO rígido. "Yo tiene tienda bajo, agua viene de
      arriba". Tono comercial y directo. Cuida mucho su propiedad.'
    prob: 0.03
  origen_este_europa:
    description: Europeo del este con español intermedio.
    style_override: Español con errores de casos y preposiciones. "Vengo de Ucrania
      y vivo aquí 3 años", "la puerta está rompido". Vocabulario bueno pero gramática
      inconsistente. Tono serio y directo.
    prob: 0.03
  origen_extranjero:
    description: Extranjero con español básico, usa traductor.
    style_override: Español de traductor o muy básico. Frases simples. A veces mezcla
      inglés. "The elevator is broken", "el ascensor no funciona por 3 dias". Tono
      educado pero confundido con los procedimientos españoles.
    prob: 0.03
  urgente:
    description: 'Estado de urgencia: necesita respuesta inmediata.'
    style_override: Tono de emergencia real. Indica que es urgente sin ser agresivo.
      "Por favor es urgente", "necesito que vengan hoy". Más excusa que exigencia.
      Prioriza la petición de acción rápida.
    prob: 0.08
  enfado_acumulado:
    description: Ya ha reclamado antes y no le hicieron caso. Acumula frustración.
    style_override: Frustración acumulada. "Ya lo dije la semana pasada y NADA", "es
      la tercera vez que llamo". Referencia a reclamaciones previas sin respuesta.
      Tono entre resignado e indignado.
    prob: 0.06
  culpable_oculto:
    description: Sabe que él mismo causó el problema y se siente culpable.
    style_override: Tono de disculpa implícita. Se nota que oculta algo. "Me parece
      que... se ha roto una tubería", evita explicar el cómo. Minimiza su responsabilidad.
      "No sé cómo pasó, pero...".
    prob: 0.03
modifier_prob: 0.3
