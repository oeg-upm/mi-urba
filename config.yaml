# ============================================================
# Logging de runs (ambos CLIs). `file` escribe además del stdout;
# en Docker apunta a un volumen montado, p. ej. /logs/run.log con
#   docker compose run -v ./logs:/logs miurba-generator ...
# ============================================================
logging:
  level: INFO
  file: null

# Vocabulario de dominio (categorías, taxonomías, personas, pesos...): vive en
# taxonomy.yaml. Las claves de taxonomía aquí están PROHIBIDAS (fail-fast).
taxonomy: taxonomy.yaml

endpoints:
  ollama_cloud:
    base_url: http://localhost:11434
    description: Ollama cloud models
    # Backoff generoso ante caídas del servidor (ConnectionError/Timeout):
    # espera max(retry_delay, 20s) * intento. Default false = lineal.
    connection_backoff: false
models:
  kimi-k2.6:
    endpoint: ollama_cloud
    model: kimi-k2.6:cloud
    temperature: 0.85
  minimax-m3:
    endpoint: ollama_cloud
    model: minimax-m3:cloud
    temperature: 0.85
  glm-5.1:
    endpoint: ollama_cloud
    model: glm-5.1:cloud
    temperature: 0.85
  gemma4-31b:
    endpoint: ollama_cloud
    model: gemma4:31b-cloud
    temperature: 0.85
generation:
  # Directorio base de salida: cada modelo escribe en <default_output_dir>/<model>/
  default_output_dir: data
  # Plan de generación por lotes [{model, count}, ...].
  # Alternativa: models: [a, b] + num_records: N (cada modelo genera N).
  batches:
  - model: kimi-k2.6
    count: 25
  - model: minimax-m3
    count: 25
  - model: glm-5.1
    count: 25
  - model: gemma4-31b
    count: 25
  # Registros por modelo cuando se usa `models` (ignorado con `batches`)
  num_records: 100
  # Primer número de ID (Q<start_id>, secuencial a lo largo del plan)
  start_id: 1
  # Semilla base de muestreo. SOLO determinista con workers: 1 (con
  # workers > 1 los hilos intercalan el stream aleatorio compartido).
  seed: null
  # Saltar registros ya presentes en los ficheros de salida
  resume: true
  # Cliente LLM: timeout por petición y política de reintentos
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  # Validación en 2ª pasada: tras generar, un LLM juez comprueba que el
  # texto alinea con el escenario; si no, reintenta la generación hasta
  # max_validation_retries veces (se conserva el último texto).
  validate: false
  max_validation_retries: 3
  # Modelo juez (clave de models:). null = validar con el propio modelo
  # generador. Recomendado: un modelo DISTINTO para evitar sesgos compartidos.
  validator: null
  # Paciencia (segundos) con modelos en frío: 5xx dentro de esta ventana son
  # "cargando" y no consumen reintentos. null = desactivado.
  model_load_wait: null
  # Quejas con fotos adjuntas declaradas (user_pics). true = se muestrea
  # según weights.photo_prob (~55%). false = ninguna queja lleva fotos:
  # user_pics vacío y el prompt indica que no adjunta (los filenames
  # nunca llegan al modelo). Independiente de image_generation.enabled,
  # que solo controla si los PNG se generan de verdad.
  photos: true
  # Workers de generación en paralelo (1 = secuencial, comportamiento actual)
  workers: 1

extraction:
  # Modelo VLM (clave de models:). OBLIGATORIO: el extractor falla si falta.
  model: kimi-k2.6
  # Temperatura de las llamadas de extracción
  temperature: 0.2
  # Base de rutas por defecto (null → generation.default_output_dir)
  default_output_dir: null
  # Directorios explícitos (null → <default_output_dir>/<subdir de paths:>)
  raw_dir: null
  annotated_dir: null
  images_dir: null
  # Saltar quejas ya presentes en extractions.jsonl
  resume: true
  # Cliente LLM: timeout por petición y política de reintentos
  timeout: 300
  max_retries: 3
  retry_delay: 5.0
  # P2 stage-split: dos llamadas (visión describe fotos → texto extrae).
  # Requiere fotos; sin fotos o sin vision_model cae a llamada única.
  stage_split: false
  # Modelo de visión para la etapa 1 (clave de models:) cuando stage_split: true
  vision_model: null
  # Paciencia (segundos) con modelos en frío: 5xx dentro de esta ventana son
  # "cargando" y no consumen reintentos. null = desactivado.
  model_load_wait: null
  # Workers de extracción en paralelo (1 = secuencial, comportamiento actual)
  workers: 1
paths:
  raw_subdir: raw
  annotated_subdir: annotated
  images_subdir: images
  complaints_file: complaints.jsonl
  extractions_file: extractions.jsonl
  ground_truth_file: ground_truth.jsonl
  metadata_file: metadata.jsonl
image_generation:
  enabled: false
  backend: flux2
  cache: diffusers/FLUX.2-dev-bnb-4bit
  output_subdir: images
  size: 1024
  steps: 28
  guidance: 4.0
  device0: cuda:0
  device1: cuda:1
  seed_base: 42
